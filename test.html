<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MIR4 Map</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      background: #000;
      color: #fff;
    }

    #map {
      flex: 1;
      background-color: #111;
      background-size: cover;
      background-position: center;
    }

    #sidebar {
      width: 360px;
      background: #1c1c1c;
      padding: 20px;
      overflow-y: auto;
      border-left: 2px solid #333;
    }

    .map-name, .submap-name {
      background: #2b2b2b;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .map-name:hover, .submap-name:hover {
      background: #444;
    }

    .submaps {
      margin-left: 15px;
      margin-bottom: 10px;
    }

    .map-display img {
      width: 100%;
      margin-top: 10px;
      border-radius: 6px;
    }

    .filename {
      text-align: center;
      margin-top: 5px;
      color: #00ffbf;
      font-size: 0.9em;
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #00bfff;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <h2>MIR4 Maps</h2>
    <div id="maps-container"></div>
    <div id="map-display" class="map-display">
      🔍 Click a map → Select submap to view image
    </div>
  </div>

  <script>
    const maps = {
      "Phantasia": ["phantasia"],
      "W8": ["pakwa1","pakwa2","abandoned-mine3-1","abandoned-mine3-2","abandoned-mine3-3"],
      "W7": ["chantra2","chantra3","dungeon"],
      "W4": ["sabak","weapon1","weapon2","blood-priest"],
      "W2": ["sochon-market","chantra-mountain","twin-path","bull-king"],
      "W5": ["icy-field","haunted-temple","demon-ruins","shadow-spider"],
      "W3": ["demon-cow-grave","demon-grassland","armado-den","iron-skeleton"]
    };

    const mapsContainer = document.getElementById('maps-container');

    Object.keys(maps).forEach(mainMap => {
      const mapDiv = document.createElement('div');
      mapDiv.className = 'map-name';
      mapDiv.textContent = mainMap;

      const submapsDiv = document.createElement('div');
      submapsDiv.className = 'submaps';
      submapsDiv.style.display = 'none';

      maps[mainMap].forEach(submap => {
        const subDiv = document.createElement('div');
        subDiv.className = 'submap-name';
        subDiv.textContent = submap;
        subDiv.onclick = () => showMap(submap);
        submapsDiv.appendChild(subDiv);
      });

      mapDiv.onclick = () => {
        document.querySelectorAll('.submaps').forEach(div => div.style.display = 'none');
        submapsDiv.style.display = 'block';
      };

      mapsContainer.appendChild(mapDiv);
      mapsContainer.appendChild(submapsDiv);
    });

    function showMap(submapName) {
      const extensions = ['.jpg', '.png'];
      let fileFound = false;

      for (let ext of extensions) {
        const fileName = submapName + ext; // ใช้ชื่อไฟล์ตรง ๆ
        const img = new Image();
        img.src = fileName;
        img.onload = () => {
          document.getElementById('map-display').innerHTML = `
            <img src="${fileName}" alt="${submapName}">
            <div class="filename">${fileName}</div>
          `;
          fileFound = true;
        };
        img.onerror = () => {
          if (!fileFound) {
            document.getElementById('map-display').innerHTML = `❌ File not found: ${fileName}`;
          }
        };
      }
    }
  </script>

</body>
</html>
